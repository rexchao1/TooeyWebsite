<!doctype html>
<!-- Source for ../og.png (the share image). Serve the repo root, open this
     page at 1200x630, screenshot it, and save the PNG as ../og.png. -->
<html lang="en"><head><meta charset="utf-8">
<title>og</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  .og { display: grid; grid-template-columns: 560px 1fr; gap: 48px; height: 630px; padding: 56px 0 0 64px; box-sizing: border-box; }
  .og-text h1 { font: 500 58px/1.06 var(--serif); letter-spacing: -.015em; margin-top: 28px; }
  .og-text p { margin-top: 26px; font-size: 24px; color: var(--ink-2); line-height: 1.4; }
  .og-text img { height: 52px; width: auto; }
  .og .sheet { width: 560px; padding: 28px 32px; height: 640px; overflow: hidden; }
  .og .sheet-day { font-size: 36px; }
</style></head>
<body><div class="og">
  <div class="og-text"><img src="../logo.png" alt=""><h1>Each morning before prep, how many of each dish to make.</h1><p>Worked out overnight from your own sales. Read a week of lists for a sample restaurant.</p></div>
  <article class="sheet" id="s"></article>
</div>
<script type="module">
import data from '../sample-data.js'; import { sheetBody } from '../sample.js';
document.getElementById('s').innerHTML = sheetBody(data, 4);
</script></body></html>
